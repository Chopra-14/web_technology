{% extends "master.html" %}

{% block title %}
Sign Up
{% endblock %}

{% block content %}

<h1>Sign Up</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Sign Up</button>

</form>

<p>
    If you already have an account,
    click here to
    <a href="/login/">Login</a>
</p>

{% endblock %}
