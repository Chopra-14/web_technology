{% extends "master.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h1>Login</h1>

<form method="post">

    {% csrf_token %}

    <label>Username:</label>
    <input type="text" name="username" required>
    <br><br>

    <label>Password:</label>
    <input type="password" name="password" required>
    <br><br>

    <button type="submit">Login</button>

</form>

<p>
    Don't have an account?
    <a href="/signup/">Sign Up</a>
</p>

{% if error_message %}
    <p>{{ error_message }}</p>
{% endif %}

{% endblock %}
