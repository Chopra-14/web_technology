<!DOCTYPE html>
<html>

<head>
    <title>Registration</title>
</head>

<body>

    <h1>Registration</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit
        </button>

    </form>

    <p>
        Already registered?

        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</body>

</html>
