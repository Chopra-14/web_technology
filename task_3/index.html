<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya University</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
    <div class="logo-section">
        <img src="../assets/aditya_university_logo.svg" alt="Aditya University" class="logo">
        <div class="divider"></div>
        <img src="../assets/naac-logo.svg" alt="NAAC" class="naac">
    </div>
    <ul class="nav-links">
        <li><a href="#">About Us</a></li>
        <li><a href="#">Academics</a></li>
        <li><a href="#">Programs</a></li>
        <li><a href="#">Research</a></li>
        <li><a href="#">Facilities</a></li>
        <li><a href="#" class="admission-btn">Admissions</a></li>
        <li><a href="#">Login</a></li>
    </ul>
    <div class="icons">
        <img src="../assets/search-icon.svg" class="icon" alt="Search">
        <img src="../assets/hamb_nav.svg" class="icon" alt="Menu">
    </div>
</nav>

<section class="content">
    <div class="text-section">
        <img src="../assets/message.jpg" alt="Message from the Chancellor" class="chancellor-message">
    </div>

    <div class="video-section">
        <video class="video" controls autoplay muted loop>
            <source src="../assets/aditya_university_video.mp4" type="video/mp4">
        </video>
    </div>

</section>

<section class="achievements">
    <div class="achieve">
        <img src="../assets/content.png" alt="Content" class="banner">
        <div class="ranking">
         <img src="../assets/nirf_ranking.png" alt="NIRF Ranking" class="nirf">
        <img src="../assets/nba.png" alt="NBA Accreditation" class="nba">
        <img src="../assets/achivements.png" alt="Achievements" class="achievement">
        </div>  
    </div>
</section>
</body>
</html>
